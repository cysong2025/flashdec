<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="chart-title chart-description" data-theme="light">
  <title id="chart-title">FlashDec performance at a glance</title>
  <desc id="chart-description">Selected validated results for Qwen end-to-end generation, vLLM attention, shared-prefix capacity, transaction dispatch and scheduler progress. A compact note retains the FlashInfer kernel-only negative comparison.</desc>
  <metadata id="evidence-metadata">{&quot;device&quot;:&quot;NVIDIA GeForce RTX 5070&quot;,&quot;evidence&quot;:[{&quot;commit&quot;:&quot;3ba68e3f5317f1a9e2f0a2830697c55de6dfe9d0&quot;,&quot;id&quot;:&quot;vllm_model_end_to_end&quot;,&quot;rows&quot;:16,&quot;trials&quot;:4},{&quot;commit&quot;:&quot;1cc25d4df9ffccb5bd804132e19eb1bce01df94e&quot;,&quot;id&quot;:&quot;vllm_attention&quot;,&quot;rows&quot;:50,&quot;trials&quot;:5},{&quot;commit&quot;:&quot;fe72e27&quot;,&quot;id&quot;:&quot;shared_prefix_capacity&quot;,&quot;rows&quot;:64,&quot;trials&quot;:8},{&quot;commit&quot;:&quot;4018449&quot;,&quot;id&quot;:&quot;trusted_transaction&quot;,&quot;rows&quot;:160,&quot;trials&quot;:5},{&quot;commit&quot;:&quot;16de9d4&quot;,&quot;id&quot;:&quot;scheduler_progress&quot;,&quot;rows&quot;:36,&quot;trials&quot;:3},{&quot;commit&quot;:&quot;d7d4feb&quot;,&quot;id&quot;:&quot;flashinfer_kernel_baseline&quot;,&quot;rows&quot;:72,&quot;trials&quot;:3}],&quot;snapshot&quot;:&quot;benchmarks/results/public_results_snapshot.json&quot;,&quot;sources&quot;:[&quot;benchmarks/results/flashinfer_paged_decode_baseline_summary.md&quot;,&quot;benchmarks/results/scheduler_capacity_progress_summary.md&quot;,&quot;benchmarks/results/shared_prefix_capacity_summary.md&quot;,&quot;benchmarks/results/trusted_transaction_summary.md&quot;,&quot;benchmarks/results/vllm_qwen_attention_summary.md&quot;,&quot;benchmarks/results/vllm_qwen_long_context_model_latency_summary.md&quot;]}</metadata>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F8FA"/>
      <stop offset="100%" stop-color="#EDE4FF" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="panel-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F29370F" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1F29370F" stop-opacity="1"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif; }
      .eyebrow { fill: #8250DF; font-size: 15px; font-weight: 760; letter-spacing: 1.5px; }
      .title { fill: #172033; font-size: 38px; font-weight: 780; letter-spacing: -0.7px; }
      .subtitle { fill: #5C6B7A; font-size: 16px; font-weight: 480; }
      .panel-title { fill: #172033; font-size: 21px; font-weight: 740; }
      .panel-copy { fill: #5C6B7A; font-size: 14px; font-weight: 500; }
      .metric { fill: #065F46; font-size: 48px; font-weight: 800; font-variant-numeric: tabular-nums; }
      .metric-small { fill: #172033; font-size: 29px; font-weight: 780; font-variant-numeric: tabular-nums; }
      .metric-label { fill: #5C6B7A; font-size: 14px; font-weight: 650; }
      .label { fill: #172033; font-size: 15px; font-weight: 680; }
      .tiny { fill: #5C6B7A; font-size: 12px; font-weight: 520; }
      .footer { fill: #5C6B7A; font-size: 12px; font-weight: 520; text-anchor: middle; }
      .panel { fill: #FFFFFF; stroke: #D8E0EA; stroke-width: 1.1; }
      .card { fill: #F8FAFC; stroke: #D8E0EA; stroke-width: 1; }
      .baseline { fill: #E7ECF2; }
      .flashdec { fill: #8250DF; }
      .good { fill: #065F46; }
      .bar-label { fill: #172033; font-size: 12px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1400" height="760" rx="26" fill="url(#background)" stroke="#D8E0EA"/>
  <text x="50" y="48" class="eyebrow">VALIDATED PERFORMANCE SNAPSHOT</text>
  <text x="50" y="91" class="title">FlashDec Performance at a Glance</text>
  <text x="50" y="120" class="subtitle">RTX 5070 · Qwen2.5-3B + vLLM results first · internal mechanisms kept in scope</text>
  <g id="model-panel" role="group" aria-label="Qwen end-to-end generation result">
    <rect x="50" y="154" width="630" height="268" rx="20" fill="url(#panel-shadow)"/>
    <rect class="panel" x="50" y="148" width="630" height="268" rx="20"/>
    <rect x="74" y="170" width="116" height="24" rx="12" fill="#DDF7EB" stroke="#065F46"/>
    <text x="132" y="187" class="eyebrow" text-anchor="middle">END-TO-END</text>
    <text x="74" y="226" class="panel-title">Qwen2.5-3B long-context generation</text>
    <text x="74" y="249" class="panel-copy">B8 · input 8192 · output 4096 · BF16 · 4 paired trials</text>
    <text x="74" y="314" class="metric">−4.58%</text>
    <text x="80" y="339" class="metric-label">LLM.generate latency</text>
    <text x="378" y="314" class="metric">+4.80%</text>
    <text x="384" y="339" class="metric-label">output tokens / second</text>
    <rect x="74" y="366" width="582" height="14" rx="7" class="baseline"/>
    <rect x="74" y="366" width="555.344" height="14" rx="7" class="flashdec"/>
    <text x="74" y="400" class="bar-label">FlashDec</text>
    <text x="656" y="400" class="bar-label" text-anchor="end">0.9542× vs vLLM 0.25.1 TRITON_ATTN</text>
  </g>
  <g id="attention-panel" role="group" aria-label="vLLM attention kernel result">
    <rect x="720" y="154" width="630" height="268" rx="20" fill="url(#panel-shadow)"/>
    <rect class="panel" x="720" y="148" width="630" height="268" rx="20"/>
    <rect x="744" y="170" width="112" height="24" rx="12" fill="#EDE4FF" stroke="#8250DF"/>
    <text x="800" y="187" class="eyebrow" text-anchor="middle">KERNEL</text>
    <text x="744" y="226" class="panel-title">vLLM decode-attention p50</text>
    <text x="744" y="249" class="panel-copy">Qwen grouped-GQA · B8 · FlashDec / vLLM Triton</text>
    <text x="744" y="298" class="label">context 1024</text>
    <text x="744" y="318" class="metric-label">−19.75%</text>
    <rect x="910" y="285" width="400" height="16" rx="8" class="baseline"/>
    <rect x="910" y="285" width="321" height="16" rx="8" class="flashdec"/>
    <text x="1310" y="322" class="bar-label" text-anchor="end">0.8025×</text>
    <text x="744" y="368" class="label">context 2048</text>
    <text x="744" y="388" class="metric-label">−20.74%</text>
    <rect x="910" y="355" width="400" height="16" rx="8" class="baseline"/>
    <rect x="910" y="355" width="317.04" height="16" rx="8" class="flashdec"/>
    <text x="1310" y="392" class="bar-label" text-anchor="end">0.7926×</text>
  </g>
  <rect x="50" y="453" width="400" height="184" rx="18" fill="url(#panel-shadow)"/>
  <rect x="50" y="448" width="400" height="184" rx="18" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.2"/>
  <circle cx="80" cy="479" r="8" fill="#1E40AF"/>
  <text x="100" y="485" class="panel-title">KV capacity</text>
  <text x="74" y="545" class="metric-small">−68.8%</text>
  <text x="74" y="572" class="label">physical context blocks · admission 16/16</text>
  <text x="74" y="603" class="tiny">75% prefix hit · fixed KV pool · not process VRAM</text>
  <rect x="500" y="453" width="400" height="184" rx="18" fill="url(#panel-shadow)"/>
  <rect x="500" y="448" width="400" height="184" rx="18" fill="#EDE4FF" stroke="#8250DF" stroke-width="1.2"/>
  <circle cx="530" cy="479" r="8" fill="#8250DF"/>
  <text x="550" y="485" class="panel-title">Transaction dispatch</text>
  <text x="524" y="545" class="metric-small">1.7307×</text>
  <text x="524" y="572" class="label">complete-token p50 · trusted vs checked</text>
  <text x="524" y="603" class="tiny">16/16 groups · cache-owned metadata only</text>
  <rect x="950" y="453" width="400" height="184" rx="18" fill="url(#panel-shadow)"/>
  <rect x="950" y="448" width="400" height="184" rx="18" fill="#DDF7EB" stroke="#065F46" stroke-width="1.2"/>
  <circle cx="980" cy="479" r="8" fill="#065F46"/>
  <text x="1000" y="485" class="panel-title">Scheduler progress</text>
  <text x="974" y="545" class="metric-small">100% vs 0%</text>
  <text x="974" y="572" class="label">boundary-case request completion</text>
  <text x="974" y="603" class="tiny">lifetime commitment vs greedy · progress, not latency</text>
  <rect x="50" y="655" width="1300" height="54" rx="16" fill="#FFFFFF" stroke="#D8E0EA"/>
  <text x="72" y="679" class="label">External reality check</text>
  <text x="232" y="679" class="panel-copy">FlashDec / FlashInfer p50 = 1.2003× / 1.2284×; FlashInfer is lower-latency for this kernel-only matrix.</text>
  <text x="72" y="699" class="tiny">This result does not include scheduler, KV ownership, prefix cache or end-to-end model execution.</text>
  <text x="700" y="738" class="footer">Canonical Markdown is authoritative · ratio directions differ across panels and are not composable</text>
</svg>
