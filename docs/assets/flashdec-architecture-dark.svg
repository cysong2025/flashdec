<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FlashDec runtime architecture</title>
  <desc id="desc">One transactional decode step across the caller, block-aware scheduler, DecodeEngine, authoritative PagedKVCache, fused RoPE and KV append, paged decode attention, and correctness evidence.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.52" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#071712"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191a3a"/>
      <stop offset="1" stop-color="#211734"/>
    </linearGradient>
    <linearGradient id="cache" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#092b24"/>
      <stop offset="1" stop-color="#0a292a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 9 4.5 0 9Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 9 4.5 0 9Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 9 4.5 0 9Z" fill="#34d399"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 9 4.5 0 9Z" fill="#22d3ee"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { fill: #f8fafc; font-size: 31px; font-weight: 750; letter-spacing: -0.5px; }
      .subtitle { fill: #a5b4cc; font-size: 16px; font-weight: 500; }
      .lane { fill: #94a3b8; font-size: 12px; font-weight: 750; letter-spacing: 1.8px; }
      .card-title { fill: #f8fafc; font-size: 20px; font-weight: 730; }
      .card-copy { fill: #a5b4cc; font-size: 14px; font-weight: 500; }
      .small { fill: #94a3b8; font-size: 12px; font-weight: 600; }
      .edge-label { fill: #a5b4cc; font-size: 12px; font-weight: 650; }
      .chip { fill: #e2e8f0; font-size: 12px; font-weight: 650; }
      .step { fill: #e2e8f0; font-size: 13px; font-weight: 650; }
      .edge { fill: none; stroke: #94a3b8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .edge-purple { fill: none; stroke: #a78bfa; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .edge-green { fill: none; stroke: #34d399; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .edge-cyan { fill: none; stroke: #22d3ee; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .evidence-edge { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5 7; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#canvas)"/>
  <rect x="14" y="14" width="1572" height="872" rx="30" fill="none" stroke="#26324d" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(62 48)">
    <circle cx="18" cy="18" r="18" fill="#a78bfa"/>
    <path d="M21 5 10 20h8l-3 12 12-17h-8Z" fill="#ffffff"/>
    <text x="50" y="19" class="title">FlashDec · one transactional decode step</text>
    <text x="50" y="48" class="subtitle">Control decisions, authoritative KV state, and the GPU data path stay explicit.</text>
  </g>
  <g transform="translate(1115 48)">
    <rect width="423" height="43" rx="21.5" fill="#0f172a" stroke="#334155"/>
    <circle cx="22" cy="21.5" r="6" fill="#22c55e"/>
    <text x="38" y="26" class="small">SINGLE GPU · ONE TOKEN / REQUEST / STEP</text>
  </g>

  <!-- Lane labels -->
  <g>
    <text x="62" y="165" class="lane">CONTROL PLANE</text>
    <line x1="186" y1="160" x2="1538" y2="160" stroke="#26324d"/>
    <text x="62" y="381" class="lane">RUNTIME STATE</text>
    <line x1="190" y1="376" x2="1198" y2="376" stroke="#26324d"/>
    <text x="62" y="635" class="lane">GPU DATA PLANE</text>
    <line x1="202" y1="630" x2="1198" y2="630" stroke="#26324d"/>
  </g>

  <!-- Caller -->
  <g filter="url(#shadow)">
    <rect x="90" y="205" width="270" height="118" rx="20" fill="#0d1b32" stroke="#60a5fa" stroke-width="1.5"/>
  </g>
  <g transform="translate(116 229)">
    <circle cx="20" cy="20" r="20" fill="#172c54"/>
    <path d="M11 20h18M20 11v18M14 14l12 12M26 14 14 26" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round"/>
    <text x="55" y="9" class="small" fill="#60a5fa">INPUT</text>
    <text x="55" y="33" class="card-title">Caller / Workload</text>
    <text x="0" y="70" class="card-copy">request specs · Q/K/V · lifecycle</text>
  </g>

  <!-- DecodeEngine -->
  <g filter="url(#shadow)">
    <rect x="435" y="187" width="360" height="154" rx="23" fill="url(#engine)" stroke="#a78bfa" stroke-width="2"/>
  </g>
  <g transform="translate(463 212)">
    <rect x="0" y="0" width="43" height="43" rx="12" fill="#2e2250"/>
    <path d="M11 13h21v17H11zM16 8v5M27 8v5M16 30v5M27 30v5M7 18h4M7 25h4M32 18h4M32 25h4" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
    <text x="59" y="12" class="small" fill="#a78bfa">ORCHESTRATOR</text>
    <text x="59" y="39" class="card-title">DecodeEngine</text>
    <text x="0" y="82" class="card-copy">stable row mapping · lifecycle validation</text>
    <text x="0" y="107" class="card-copy">transaction · policy/snapshot validation</text>
  </g>

  <!-- Scheduler -->
  <g filter="url(#shadow)">
    <rect x="875" y="205" width="305" height="118" rx="20" fill="#082737" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <g transform="translate(900 228)">
    <circle cx="20" cy="20" r="20" fill="#123448"/>
    <path d="M10 14h20M10 20h13M10 26h17" fill="none" stroke="#38bdf8" stroke-width="2.3" stroke-linecap="round"/>
    <circle cx="28" cy="20" r="3" fill="#38bdf8"/>
    <text x="55" y="9" class="small" fill="#38bdf8">PURE · BOUND DECISION</text>
    <text x="55" y="33" class="card-title">Block-aware Scheduler</text>
    <text x="0" y="70" class="card-copy">lifetime commitment · FIFO + aging</text>
  </g>

  <!-- Control edges -->
  <path d="M360 258H435" class="edge-purple" marker-end="url(#arrow-purple)"/>
  <rect x="350" y="229" width="94" height="20" rx="10" fill="#111827"/>
  <text x="397" y="243" text-anchor="middle" class="edge-label">specs · Q/K/V</text>

  <path d="M795 232H875" class="edge" marker-end="url(#arrow)"/>
  <text x="835" y="218" text-anchor="middle" class="edge-label">state snapshot</text>
  <path d="M875 292H795" class="edge" marker-end="url(#arrow)"/>
  <text x="835" y="313" text-anchor="middle" class="edge-label">bound decision</text>

  <!-- Authoritative cache -->
  <g filter="url(#shadow)">
    <rect x="390" y="407" width="720" height="188" rx="24" fill="url(#cache)" stroke="#34d399" stroke-width="2"/>
  </g>
  <g transform="translate(420 432)">
    <g>
      <rect x="0" y="2" width="49" height="49" rx="13" fill="#123e34"/>
      <rect x="11" y="12" width="13" height="13" rx="3" fill="none" stroke="#34d399" stroke-width="2"/>
      <rect x="27" y="12" width="13" height="13" rx="3" fill="none" stroke="#34d399" stroke-width="2"/>
      <rect x="11" y="28" width="13" height="13" rx="3" fill="none" stroke="#34d399" stroke-width="2"/>
      <rect x="27" y="28" width="13" height="13" rx="3" fill="#34d399"/>
    </g>
    <text x="67" y="13" class="small" fill="#34d399">AUTHORITATIVE STATE</text>
    <text x="67" y="42" class="card-title">PagedKVCache · single source of truth</text>
    <text x="0" y="78" class="card-copy">Only this runtime owns blocks, request lifecycle, seq_len, and transaction state.</text>
    <g transform="translate(0 103)">
      <rect width="142" height="32" rx="16" fill="#123e34" stroke="#1f6f5a"/>
      <text x="71" y="21" text-anchor="middle" class="chip">block ownership</text>
      <rect x="154" width="162" height="32" rx="16" fill="#123e34" stroke="#1f6f5a"/>
      <text x="235" y="21" text-anchor="middle" class="chip">seq_len + lifecycle</text>
      <rect x="328" width="150" height="32" rx="16" fill="#123e34" stroke="#1f6f5a"/>
      <text x="403" y="21" text-anchor="middle" class="chip">token transaction</text>
      <rect x="490" width="180" height="32" rx="16" fill="#123e34" stroke="#1f6f5a"/>
      <text x="580" y="21" text-anchor="middle" class="chip">immutable shared prefix</text>
    </g>
  </g>

  <!-- Engine lifecycle edge -->
  <path d="M615 341V407" class="edge-green" marker-end="url(#arrow-green)"/>
  <rect x="628" y="365" width="136" height="22" rx="11" fill="#111827"/>
  <text x="696" y="380" text-anchor="middle" class="edge-label">begin · commit · abort</text>

  <!-- GPU cards -->
  <g filter="url(#shadow)">
    <rect x="90" y="662" width="450" height="130" rx="22" fill="#2a210d" stroke="#fbbf24" stroke-width="1.7"/>
  </g>
  <g transform="translate(117 686)">
    <circle cx="23" cy="23" r="23" fill="#493916"/>
    <path d="M12 26c6-14 17-14 23-5M35 20l1-8 7 4M34 24c-6 14-17 14-23 5M12 30l-1 8-7-4" fill="none" stroke="#fbbf24" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="10" class="small" fill="#fbbf24">WRITE PATH</text>
    <text x="64" y="38" class="card-title">Fused RoPE + KV Append</text>
    <text x="0" y="79" class="card-copy">CUDA extension · PyTorch fallback</text>
    <text x="0" y="103" class="small">rotates Q/K · writes K/V · never advances seq_len</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="662" width="460" height="130" rx="22" fill="#082b32" stroke="#22d3ee" stroke-width="1.7"/>
  </g>
  <g transform="translate(678 686)">
    <circle cx="23" cy="23" r="23" fill="#123d45"/>
    <circle cx="13" cy="23" r="4" fill="#22d3ee"/>
    <circle cx="33" cy="13" r="4" fill="#22d3ee"/>
    <circle cx="33" cy="33" r="4" fill="#22d3ee"/>
    <path d="M17 21 29 15M17 25l12 6" stroke="#22d3ee" stroke-width="2"/>
    <text x="64" y="10" class="small" fill="#67e8f9">READ PATH</text>
    <text x="64" y="38" class="card-title">Paged Decode Attention</text>
    <text x="0" y="79" class="card-copy">Triton kernel · PyTorch correctness reference</text>
    <text x="0" y="103" class="small">MHA / GQA / MQA · FP16 / BF16</text>
  </g>

  <!-- Engine / cache / GPU edges -->
  <path d="M490 341H350V662" class="edge-purple" marker-end="url(#arrow-purple)"/>
  <rect x="245" y="617" width="112" height="22" rx="11" fill="#111827"/>
  <text x="301" y="632" text-anchor="middle" class="edge-label">Q/K/V · layer i</text>

  <path d="M451 595V662" class="edge-green" marker-end="url(#arrow-green)"/>
  <text x="441" y="620" text-anchor="end" class="edge-label">block · offset · position</text>
  <path d="M500 662V595" class="edge-green" marker-end="url(#arrow-green)"/>
  <text x="510" y="648" class="edge-label">write rotated K + V</text>

  <path d="M540 727H650" class="edge-cyan" marker-end="url(#arrow-cyan)"/>
  <rect x="554" y="696" width="82" height="22" rx="11" fill="#111827"/>
  <text x="595" y="711" text-anchor="middle" class="edge-label">rotated Q</text>

  <path d="M890 595V662" class="edge-green" marker-end="url(#arrow-green)"/>
  <text x="901" y="620" class="edge-label">paged K/V · tables · effective seq_lens</text>

  <path d="M1035 662H1155V354H760V341" class="edge-cyan" marker-end="url(#arrow-cyan)"/>
  <rect x="988" y="343" width="102" height="22" rx="11" fill="#111827"/>
  <text x="1039" y="358" text-anchor="middle" class="edge-label">layer output</text>

  <!-- Evidence boundary -->
  <g filter="url(#shadow)">
    <rect x="1235" y="187" width="303" height="605" rx="23" fill="#111827" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="7 6"/>
  </g>
  <g transform="translate(1262 214)">
    <circle cx="22" cy="22" r="22" fill="#293548"/>
    <path d="m12 22 7 7 14-16" fill="none" stroke="#a5b4cc" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="11" class="small">OBSERVABILITY</text>
    <text x="60" y="37" class="card-title">Correctness &amp; Evidence</text>
    <line x1="0" y1="72" x2="249" y2="72" stroke="#334155"/>

    <g transform="translate(0 98)">
      <rect width="249" height="91" rx="16" fill="#111827" stroke="#26324d"/>
      <circle cx="25" cy="28" r="8" fill="#60a5fa"/>
      <text x="45" y="24" class="chip">PyTorch references</text>
      <text x="45" y="46" class="small">dense · paged · state machine</text>
      <text x="20" y="72" class="small">sampled + full cross-backend parity</text>
    </g>
    <g transform="translate(0 205)">
      <rect width="249" height="91" rx="16" fill="#111827" stroke="#26324d"/>
      <circle cx="25" cy="28" r="8" fill="#34d399"/>
      <text x="45" y="24" class="chip">Strict summaries</text>
      <text x="45" y="46" class="small">shape · seed · trials · timing</text>
      <text x="20" y="72" class="small">commit-bound canonical evidence</text>
    </g>
    <g transform="translate(0 312)">
      <rect width="249" height="112" rx="16" fill="#221c3d" stroke="#6d5aa5"/>
      <circle cx="25" cy="28" r="8" fill="#a78bfa"/>
      <text x="45" y="24" class="chip">FlashInfer kernel baseline</text>
      <text x="20" y="55" class="small">pinned external implementation</text>
      <rect x="20" y="72" width="209" height="24" rx="12" fill="#2e2250"/>
      <text x="124" y="88" text-anchor="middle" class="small" fill="#c4b5fd">KERNEL-ONLY COMPARISON</text>
    </g>
    <g transform="translate(0 453)">
      <rect width="249" height="85" rx="16" fill="#2b1e11" stroke="#6b4e22"/>
      <text x="20" y="29" class="chip">Boundary</text>
      <text x="20" y="52" class="small">No scheduler, prefix, ownership,</text>
      <text x="20" y="70" class="small">or serving claim crosses this line.</text>
    </g>
  </g>

  <!-- Evidence dotted edges -->
  <path d="M795 270H1235" class="evidence-edge"/>
  <path d="M1110 501H1205V459H1235" class="evidence-edge"/>
  <path d="M1110 747H1205V654H1235" class="evidence-edge"/>
  <circle cx="1235" cy="270" r="4" fill="#94a3b8"/>
  <circle cx="1235" cy="459" r="4" fill="#94a3b8"/>
  <circle cx="1235" cy="654" r="4" fill="#94a3b8"/>

  <!-- Transaction strip -->
  <g transform="translate(90 824)">
    <rect width="1448" height="48" rx="18" fill="#0f172a" stroke="#26324d"/>
    <text x="22" y="29" class="lane" fill="#a78bfa">TOKEN TRANSACTION</text>
    <circle cx="197" cy="24" r="14" fill="#2e2250"/>
    <text x="197" y="29" text-anchor="middle" class="step" fill="#c4b5fd">1</text>
    <text x="219" y="29" class="step">reserve once</text>
    <path d="M318 24h35" class="edge" marker-end="url(#arrow)"/>
    <circle cx="380" cy="24" r="14" fill="#493916"/>
    <text x="380" y="29" text-anchor="middle" class="step" fill="#fbbf24">2</text>
    <text x="402" y="29" class="step">for each layer: RoPE · write K/V · attention</text>
    <path d="M729 24h35" class="edge" marker-end="url(#arrow)"/>
    <circle cx="791" cy="24" r="14" fill="#123e34"/>
    <text x="791" y="29" text-anchor="middle" class="step" fill="#34d399">3</text>
    <text x="813" y="29" class="step">commit seq_len once</text>
    <rect x="1014" y="10" width="407" height="28" rx="14" fill="#331923" stroke="#713044"/>
    <text x="1217" y="29" text-anchor="middle" class="step" fill="#fb7185">on failure · abort + rollback reservation</text>
  </g>
</svg>
