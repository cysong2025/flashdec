<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="architecture-title architecture-description" data-theme="light">
  <title id="architecture-title">FlashDec integration architecture</title>
  <desc id="architecture-description">vLLM owns model execution, prefill, scheduling and sampling. Its custom attention router sends eligible single-token decode to the transactional FlashDec runtime and unsupported work to the native Triton fallback.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F8FA"/>
      <stop offset="100%" stop-color="#EDE4FF" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F29370F" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1F29370F" stop-opacity="1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B98A7"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8250DF"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9A6700"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif; }
      .eyebrow { fill: #8250DF; font-size: 15px; font-weight: 760; letter-spacing: 1.5px; }
      .title { fill: #172033; font-size: 38px; font-weight: 780; letter-spacing: -0.7px; }
      .subtitle { fill: #5C6B7A; font-size: 17px; font-weight: 480; }
      .lane { fill: #8B98A7; font-size: 13px; font-weight: 760; letter-spacing: 1.3px; }
      .card-title { fill: #172033; font-size: 20px; font-weight: 740; }
      .card-copy { fill: #5C6B7A; font-size: 14px; font-weight: 500; }
      .chip { fill: #172033; font-size: 13px; font-weight: 650; }
      .edge-label { fill: #5C6B7A; font-size: 13px; font-weight: 650; }
      .scope { fill: #5C6B7A; font-size: 13px; font-weight: 520; text-anchor: middle; }
      .panel { fill: #FFFFFF; stroke: #D8E0EA; stroke-width: 1.2; }
      .soft { fill: #F8FAFC; stroke: #D8E0EA; stroke-width: 1.1; }
      .arrow { fill: none; stroke: #8B98A7; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-purple { fill: none; stroke: #8250DF; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-amber { fill: none; stroke: #9A6700; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect width="1400" height="720" rx="26" fill="url(#background)" stroke="#D8E0EA"/>
  <circle cx="70" cy="67" r="26" fill="#8250DF"/>
  <text x="70" y="76" class="card-title" text-anchor="middle">⚡</text>
  <text x="112" y="59" class="eyebrow">FLASHDEC ARCHITECTURE</text>
  <text x="112" y="95" class="title">A focused decode path inside vLLM</text>
  <text x="112" y="124" class="subtitle">Keep the engine; replace eligible single-token attention with an auditable transactional path.</text>
  <text x="52" y="180" class="lane">VLLM CONTROL PLANE</text>
  <line x1="232" y1="175" x2="1348" y2="175" stroke="#D8E0EA"/>
  <rect x="52" y="205" width="250" height="84" rx="18" fill="url(#shadow)"/>
  <rect x="52" y="200" width="250" height="84" rx="18" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.5"/>
  <circle cx="84" cy="231" r="18" fill="#1E40AF" fill-opacity="0.15"/>
  <text x="84" y="237" class="card-title" text-anchor="middle">1</text>
  <text x="110" y="228" class="card-title">Request / Qwen</text>
  <text x="110" y="251" class="card-copy">prompt · model · generation</text>
  <rect x="350" y="205" width="250" height="84" rx="18" fill="url(#shadow)"/>
  <rect x="350" y="200" width="250" height="84" rx="18" fill="#FFFFFF" stroke="#8B98A7" stroke-width="1.5"/>
  <circle cx="382" cy="231" r="18" fill="#8B98A7" fill-opacity="0.15"/>
  <text x="382" y="237" class="card-title" text-anchor="middle">2</text>
  <text x="408" y="228" class="card-title">vLLM Engine</text>
  <text x="408" y="251" class="card-copy">prefill · scheduler · KV layout</text>
  <rect x="648" y="195" width="300" height="104" rx="18" fill="url(#shadow)"/>
  <rect x="648" y="190" width="300" height="104" rx="18" fill="#EDE4FF" stroke="#8250DF" stroke-width="1.5"/>
  <circle cx="680" cy="221" r="18" fill="#8250DF" fill-opacity="0.15"/>
  <text x="680" y="227" class="card-title" text-anchor="middle">3</text>
  <text x="706" y="218" class="card-title">FlashDec plugin router</text>
  <text x="706" y="241" class="card-copy">CUSTOM backend · strict eligibility</text>
  <rect x="1058" y="205" width="290" height="84" rx="18" fill="url(#shadow)"/>
  <rect x="1058" y="200" width="290" height="84" rx="18" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.5"/>
  <circle cx="1090" cy="231" r="18" fill="#1E40AF" fill-opacity="0.15"/>
  <text x="1090" y="237" class="card-title" text-anchor="middle">4</text>
  <text x="1116" y="228" class="card-title">Sampling / serving</text>
  <text x="1116" y="251" class="card-copy">still owned by vLLM</text>
  <path d="M302 242H350" class="arrow" marker-end="url(#arrow)"/>
  <path d="M600 242H648" class="arrow-purple" marker-end="url(#arrow-purple)"/>
  <path d="M948 242H1058" class="arrow" marker-end="url(#arrow)"/>
  <text x="52" y="356" class="lane">FLASHDEC DECODE PATH</text>
  <line x1="250" y1="351" x2="1348" y2="351" stroke="#D8E0EA"/>
  <path d="M798 294V379" class="arrow-purple" marker-end="url(#arrow-purple)"/>
  <text x="812" y="337" class="edge-label">eligible decode</text>
  <rect x="150" y="387" width="318" height="100" rx="18" fill="url(#shadow)"/>
  <rect x="150" y="382" width="318" height="100" rx="18" fill="#EDE4FF" stroke="#8250DF" stroke-width="1.5"/>
  <circle cx="182" cy="413" r="18" fill="#8250DF" fill-opacity="0.15"/>
  <text x="182" y="419" class="card-title" text-anchor="middle">A</text>
  <text x="208" y="410" class="card-title">DecodeEngine</text>
  <text x="208" y="433" class="card-copy">begin · step layers · commit / abort</text>
  <rect x="510" y="387" width="380" height="100" rx="18" fill="url(#shadow)"/>
  <rect x="510" y="382" width="380" height="100" rx="18" fill="#DDF7EB" stroke="#065F46" stroke-width="1.5"/>
  <circle cx="542" cy="413" r="18" fill="#065F46" fill-opacity="0.15"/>
  <text x="542" y="419" class="card-title" text-anchor="middle">B</text>
  <text x="568" y="410" class="card-title">Transactional PagedKVCache</text>
  <text x="568" y="433" class="card-copy">blocks · seq_len · refcount · rollback</text>
  <rect x="932" y="387" width="318" height="100" rx="18" fill="url(#shadow)"/>
  <rect x="932" y="382" width="318" height="100" rx="18" fill="#DDF7EB" stroke="#065F46" stroke-width="1.5"/>
  <circle cx="964" cy="413" r="18" fill="#065F46" fill-opacity="0.15"/>
  <text x="964" y="419" class="card-title" text-anchor="middle">C</text>
  <text x="990" y="410" class="card-title">Policy + prefix</text>
  <text x="990" y="433" class="card-copy">admission · FIFO aging · LRU</text>
  <path d="M468 432H510" class="arrow-purple" marker-end="url(#arrow-purple)"/>
  <path d="M890 432H932" class="arrow-purple" marker-end="url(#arrow-purple)"/>
  <path d="M948 224H1012V330H1262" class="arrow-amber" marker-end="url(#arrow-amber)"/>
  <rect x="1046" y="306" width="302" height="50" rx="15" fill="#FFF3C4" stroke="#9A6700"/>
  <text x="1064" y="328" class="card-title">Unsupported path → vLLM Triton</text>
  <text x="1064" y="347" class="card-copy">prefill · mixed batch · unsupported shape</text>
  <text x="52" y="544" class="lane">GPU DATA PLANE</text>
  <line x1="198" y1="539" x2="1348" y2="539" stroke="#D8E0EA"/>
  <path d="M700 482V566" class="arrow-purple" marker-end="url(#arrow-purple)"/>
  <rect x="220" y="571" width="400" height="88" rx="18" fill="url(#shadow)"/>
  <rect x="220" y="566" width="400" height="88" rx="18" fill="#FFF3C4" stroke="#9A6700" stroke-width="1.5"/>
  <circle cx="252" cy="597" r="18" fill="#9A6700" fill-opacity="0.15"/>
  <text x="252" y="603" class="card-title" text-anchor="middle">K</text>
  <text x="278" y="594" class="card-title">Fused RoPE + KV append</text>
  <text x="278" y="617" class="card-copy">CUDA extension · checked PyTorch fallback</text>
  <rect x="780" y="571" width="400" height="88" rx="18" fill="url(#shadow)"/>
  <rect x="780" y="566" width="400" height="88" rx="18" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.5"/>
  <circle cx="812" cy="597" r="18" fill="#1E40AF" fill-opacity="0.15"/>
  <text x="812" y="603" class="card-title" text-anchor="middle">Q</text>
  <text x="838" y="594" class="card-title">Split-KV PagedAttention</text>
  <text x="838" y="617" class="card-copy">Triton · grouped GQA · query-head reducer</text>
  <path d="M620 610H780" class="arrow-purple" marker-end="url(#arrow-purple)"/>
  <rect x="270" y="674" width="860" height="30" rx="15" fill="#FFFFFF" stroke="#D8E0EA"/>
  <text x="700" y="695" class="scope">PyTorch reference  ·  cross-backend parity  ·  capture attestation  ·  commit-bound evidence</text>
</svg>
