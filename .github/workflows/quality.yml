name: repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test runner
        run: python -m pip install pytest
      - name: Check documentation links
        run: python scripts/check_docs.py
      - name: Check release artifacts
        run: python scripts/check_release.py --require-evidence --require-public
      - name: Compile Python sources
        run: python -m compileall -q flashdec tests benchmarks scripts
      - name: Run dependency-free tests
        run: >-
          python -m pytest -q
          tests/test_benchmark_helpers.py
          tests/test_docs_check.py
          tests/test_profile_decode_engine.py
          tests/test_profile_paged_decode.py
          tests/test_decode_engine_trial_summary.py
          tests/test_validation_orchestrator.py
          tests/test_release_check.py
          tests/test_scheduled_workload_config.py
          tests/test_scheduler.py
          tests/test_scheduler_workload_summary.py
          tests/test_multi_layer_workload_benchmark.py
          tests/test_multi_layer_workload_summary.py
          tests/test_fused_transaction_fast_path_benchmark.py
          tests/test_fused_transaction_fast_path_summary.py
          tests/test_integrated_workload_config.py
          tests/test_integrated_workload_benchmark.py
          tests/test_integrated_workload_summary.py
          tests/test_flashinfer_baseline_benchmark.py
          tests/test_flashinfer_baseline_summary.py
          tests/test_summary_default_paths.py
          tests/test_public_architecture.py
          tests/test_public_results_chart.py

  python-310-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install test runner
        run: python -m pip install pytest
      - name: Exercise Python 3.10 metadata fallback and public checks
        run: >-
          python -m pytest -q
          tests/test_docs_check.py
          tests/test_release_check.py
          tests/test_public_architecture.py
          tests/test_public_results_chart.py
      - name: Check public release tree
        run: python scripts/check_release.py --require-evidence --require-public
