[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdec"
version = "0.0.0"
description = "A single-GPU LLM decode runtime with paged KV cache, Triton attention, CUDA append, scheduling, and multi-layer transactions."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "songchuangye" }]
keywords = ["llm", "inference", "triton", "cuda", "paged-attention", "kv-cache"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch",
  "triton",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
cuda-extension = [
  "ninja",
]
baseline = [
  "flashinfer-python==0.6.15.post1",
]

[project.urls]
Repository = "https://github.com/cysong2025/flashdec"
Documentation = "https://github.com/cysong2025/flashdec/tree/main/docs"

[tool.setuptools.packages.find]
include = ["flashdec*"]

[tool.setuptools.package-data]
flashdec = ["csrc/*.cpp", "csrc/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
