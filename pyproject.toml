[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdec"
version = "0.0.0"
description = "A single-GPU LLM decode runtime with paged KV cache, Triton attention, CUDA append, scheduling, and multi-layer transactions."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["llm", "inference", "triton", "cuda", "paged-attention", "kv-cache"]
dependencies = [
  "torch",
  "triton",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
cuda-extension = [
  "ninja",
]

[project.urls]
Repository = "https://github.com/cysong2025/flashdec"
Documentation = "https://github.com/cysong2025/flashdec/tree/main/docs"

[tool.setuptools.packages.find]
include = ["flashdec*"]

[tool.setuptools.package-data]
flashdec = ["csrc/*.cpp", "csrc/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
