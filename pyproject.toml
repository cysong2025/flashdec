[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdec"
version = "0.0.0"
description = "LLM decode attention and paged KV cache experiments with PyTorch, Triton, and CUDA."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "triton",
  "pytest",
  "pandas",
  "matplotlib",
  "tabulate",
]

[project.optional-dependencies]
cuda-extension = [
  "ninja",
]

[tool.setuptools.packages.find]
include = ["flashdec*"]

[tool.setuptools.package-data]
flashdec = ["csrc/*.cpp", "csrc/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
