[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdec"
version = "0.0.0"
description = "Single-GPU LLM decode research prototype with paged KV cache, Triton attention, CUDA append, scheduling, shared prefixes, and multi-layer transactions."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "songchuangye" }]
keywords = [
  "llm-inference",
  "inference-runtime",
  "gpu-kernels",
  "pytorch",
  "triton",
  "cuda",
  "paged-attention",
  "kv-cache",
  "request-scheduling",
  "prefix-caching",
  "systems-research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch",
  "triton",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
cuda-extension = [
  "ninja",
]
baseline = [
  "flashinfer-python==0.6.15.post1",
]
vllm = [
  "vllm==0.25.1",
]

[project.entry-points."vllm.general_plugins"]
flashdec = "flashdec.vllm_plugin:register"

[project.urls]
Repository = "https://github.com/cysong2025/flashdec"
Documentation = "https://github.com/cysong2025/flashdec/tree/main/docs"
Issues = "https://github.com/cysong2025/flashdec/issues"
Changelog = "https://github.com/cysong2025/flashdec/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["flashdec*"]

[tool.setuptools.package-data]
flashdec = ["csrc/*.cpp", "csrc/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
